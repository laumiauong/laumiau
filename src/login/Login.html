<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lau Miau - Login</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <main>
        
        <div style="text-align: center;">
            <h1 class="brand-title">
                <img class="logo" src="/public/img/logo.svg" alt="logo lau miau">
            </h1>
        </div>

        <h2 id="page-title" class="page-title">Vamos Começar!</h2>

        <form id="auth-form">
            
            <div id="feedback-message"></div>

            <div class="input-group">
                <i class="fa-regular fa-user input-icon"></i>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Nome de Usuário ou Email" 
                    aria-label="Nome de Usuário ou Email"
                    autocomplete="username" 
                    required
                >
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Senha" 
                    aria-label="Senha"
                    autocomplete="current-password" 
                    required
                >
                <i class="fa-regular fa-eye-slash toggle-password" id="toggle-password"></i>
            </div>

            <a href="#" id="forgot-password-link" class="forgot-password">esqueceu sua senha?</a>

            <div class="divider">ou</div>

            <button type="button" class="btn-social">
                <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
                Continuar com o Google
            </button>
            
            <button type="button" class="btn-social">
                <i class="fa-brands fa-apple" style="font-size: 1.4rem;"></i>
                Continuar com a Apple
            </button>

            <button type="submit" id="submit-btn" class="btn-primary">
                Entrar
            </button>

            <div class="toggle-container">
                <a href="../cadastro-usuario/cadastro-usuario.html" class="toggle-link">
    Cadastrar-se
</a>
                </a>
            </div>
        </form>

        <footer>
            <a href="#">Política de Privacidade</a>
            <i class="fa-solid fa-paw" style="color: #FF8C00; font-size: 10px;"></i>
            <a href="#">Termos de Serviço</a>
        </footer>

    </main>

    <script src="script.js"></script> 
</body>
</html>
