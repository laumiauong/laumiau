<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lau Miau - Dashboard Administrativo</title>
    
    <!-- Google Fonts (Quicksand para simular a fonte arredondada do design) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            bg: '#FDF6F0',
                            orange: '#FF9F1C',
                            dark: '#2D3436',
                            gray: '#636E72',
                            green: '#2ECC71',
                            yellow: '#F1C40F'
                        }
                    }
                }
            }
        }
    </script>

    <!-- CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-brand-dark font-sans min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-2">
                    <h1 class="text-3xl font-bold tracking-tight text-brand-orange flex items-center gap-2">
                        LAU <i data-lucide="paw-print" class="w-6 h-6 fill-current"></i> MIAU
                    </h1>
                </div>

                <nav class="hidden md:flex space-x-8">
                    <a href="#" class="px-4 py-2 bg-brand-orange/10 text-brand-orange font-bold rounded-full">Dashboard</a>
                    <a href="#" class="px-4 py-2 text-gray-500 hover:text-brand-orange font-medium transition-colors">Animais</a>
                    <a href="#" class="px-4 py-2 text-gray-500 hover:text-brand-orange font-medium transition-colors">Adotantes</a>
                </nav>

                <div class="flex items-center gap-4">
                    <button onclick="resetApp()" class="text-xs text-gray-400 hover:text-red-500 underline" title="Limpar LocalStorage">Resetar Dados</button>
                    <button class="flex items-center gap-2 px-4 py-2 border-2 border-brand-orange text-brand-orange font-bold rounded-full hover:bg-brand-orange hover:text-white transition-colors">
                        <i data-lucide="settings" class="w-4 h-4"></i>
                        <span>Sair</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-900">Dashboard Administrativo</h2>
            <p class="text-brand-gray mt-1">Visão geral das atividades da ONG</p>
        </div>

        <!-- STATS GRID -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8" id="stats-container"></section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- LISTA DE SOLICITAÇÕES -->
            <section class="lg:col-span-2 bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-gray-800">Solicitações Recentes</h3>
                    <button class="text-brand-orange font-semibold hover:underline text-sm border border-brand-orange px-3 py-1 rounded-full hover:bg-brand-orange/10 transition">Ver todas</button>
                </div>

                <div class="space-y-4" id="requests-container"></div>
            </section>

            <!-- AÇÕES E ATIVIDADES -->
            <aside class="space-y-8">
                
                <!-- Ações Rápidas -->
                <section class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Ações Rápidas</h3>
                    <div class="space-y-3">
                        <button onclick="addNewPet()" class="w-full py-3 px-4 bg-brand-orange text-white font-bold rounded-xl shadow-lg shadow-brand-orange/30 hover:bg-orange-600 active:scale-95 transition-all flex items-center justify-center gap-2">
                            <i data-lucide="plus-circle" class="w-5 h-5"></i>
                            Cadastrar Novo Pet
                        </button>
                        <button class="w-full py-3 px-4 border-2 border-brand-orange text-brand-orange font-bold rounded-xl hover:bg-brand-orange/5 transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="file-text" class="w-5 h-5"></i>
                            Gerenciar Animais
                        </button>
                    </div>
                </section>

                <!-- Atividades Recentes -->
                <section class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Atividades Recentes</h3>
                    <ul class="space-y-4 relative border-l-2 border-gray-100 ml-3 pl-6" id="activities-container"></ul>
                </section>
            </aside>

        </div>
    </main>

    <!-- Script Principal -->
    <script src="app.js"></script>
</body>
</html>
