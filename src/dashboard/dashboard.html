<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lau Miau - Dashboard Administrativo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#FF9900',
                            bg: '#FFFBF5',
                            text: '#1F2937',
                        }
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col font-sans relative">

    <header class="bg-white border-b border-orange-100 py-4 px-6 md:px-12 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-2">
            <h1 class="text-3xl font-extrabold text-brand-orange tracking-tight flex items-center gap-1">
                LAU <i class="ph-fill ph-paw-print text-2xl"></i> MIAU
            </h1>
        </div>

        <nav class="hidden md:flex items-center gap-8">
            <a href="#" class="bg-orange-100 text-brand-orange px-6 py-2 rounded-full font-bold text-sm">Dashboard</a>
            <a href="#" class="text-gray-600 font-semibold hover:text-brand-orange transition-colors">Animais</a>
            <a href="#" class="text-gray-600 font-semibold hover:text-brand-orange transition-colors">Adotantes</a>
        </nav>

        <button onclick="logout()" class="flex items-center gap-2 text-brand-orange border border-orange-200 px-4 py-2 rounded-full hover:bg-orange-50 transition font-bold text-sm">
            <i class="ph-bold ph-sign-out"></i>
            Sair
        </button>
    </header>

    <main class="flex-1 p-6 md:p-12 max-w-7xl mx-auto w-full filter transition-all duration-300" id="main-content">
        
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-800">Dashboard Administrativo</h2>
            <p class="text-gray-500 mt-1">Visão geral das atividades da ONG</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10" id="stats-container"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2 bg-white rounded-3xl p-6 card-shadow border border-gray-100">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-lg text-gray-700">Solicitações Recentes</h3>
                    <button class="text-brand-orange border border-orange-200 px-4 py-1 rounded-full text-sm font-bold hover:bg-orange-50">
                        Ver todas
                    </button>
                </div>
                <div id="requests-list" class="flex flex-col gap-4"></div>
            </div>

            <div class="flex flex-col gap-6">
                
                <div class="bg-white rounded-3xl p-6 card-shadow border border-gray-100">
                    <h3 class="font-bold text-gray-700 text-center mb-6 text-sm uppercase tracking-wide">Ações Rápidas</h3>
                    <div class="flex flex-col gap-3">
                        <button onclick="toggleModal(true)" class="w-full bg-brand-orange text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-orange-200 hover:brightness-105 transition-all">
                            <div class="bg-white/20 rounded-full p-1"><i class="ph-bold ph-plus text-white"></i></div>
                            Cadastrar Novo Pet
                        </button>
                        <button class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-orange-200 hover:brightness-105 transition-all">
                            <div class="bg-white/20 rounded-full p-1"><i class="ph-bold ph-chart-line-up text-white"></i></div>
                            Gerenciar Animais
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-6 card-shadow border border-gray-100 flex-1">
                    <h3 class="font-bold text-gray-700 mb-4 text-sm">Atividades Recentes</h3>
                    <ul id="activity-list" class="space-y-4 text-sm relative border-l-2 border-orange-100 ml-2 pl-4"></ul>
                </div>
            </div>
        </div>
    </main>

    <div id="petModal" class="fixed inset-0 bg-gray-900/50 hidden items-center justify-center z-50 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 m-4 transform scale-95 transition-transform duration-300" id="modal-panel">
            
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Novo Pet</h3>
                <button onclick="toggleModal(false)" class="text-gray-400 hover:text-red-500 transition-colors">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>

            <form onsubmit="handleFormSubmit(event)" class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Nome do Pet</label>
                    <input type="text" id="petNameInput" required placeholder="Ex: Thor" 
                           class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-brand-orange focus:ring-2 focus:ring-orange-100 transition-all">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Tipo</label>
                    <select id="petTypeInput" class="w-full border border-gray-300 rounded-xl px-4 py-3 bg-white focus:outline-none focus:border-brand-orange">
                        <option value="Cão">Cão</option>
                        <option value="Gato">Gato</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-brand-orange text-white font-bold py-3 rounded-xl shadow-lg shadow-orange-200 hover:bg-orange-600 transition-colors">
                        Salvar Cadastro
                    </button>
                    <button type="button" onclick="toggleModal(false)" class="w-full mt-2 text-gray-500 font-semibold py-2 hover:text-gray-800 transition-colors">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
