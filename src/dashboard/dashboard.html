<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lau Miau - Dashboard Administrativo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#FF9900',
                            bg: '#FFFBF5',
                            text: '#1F2937',
                        }
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    </head>
<body class="min-h-screen flex flex-col font-sans relative bg-brand-bg">

    <header class="bg-white border-b border-orange-100 py-4 px-6 md:px-12 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-2">
            <h1 class="text-3xl font-extrabold text-brand-orange tracking-tight flex items-center gap-1">
             <img class="logo h-10" src="/public/img/logo.svg" alt="logo lau miau">
            </h1>
        </div>

        <nav class="hidden md:flex items-center gap-8">
            <a href="#" class="bg-orange-100 text-brand-orange px-6 py-2 rounded-full font-bold text-sm">Dashboard</a>
            <a href="../animais-cadastrados/animais-cadastrados.html" class="text-gray-600 font-semibold hover:text-brand-orange transition-colors">Animais</a>
            <a href="#" class="text-gray-600 font-semibold hover:text-brand-orange transition-colors">Adotantes</a>
        </nav>

        <button onclick="logout()" class="flex items-center gap-2 text-brand-orange border border-orange-200 px-4 py-2 rounded-full hover:bg-orange-50 transition font-bold text-sm">
            <i class="ph-bold ph-sign-out"></i>
            Sair
        </button>
    </header>

    <main class="flex-1 p-6 md:p-12 max-w-7xl mx-auto w-full filter transition-all duration-300" id="main-content">
        
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-800">Dashboard Administrativo</h2>
            <p class="text-gray-500 mt-1">Visão geral das atividades da ONG</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10" id="stats-container"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2 bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-lg text-gray-700">Solicitações Recentes</h3>
                    <button class="text-brand-orange border border-orange-200 px-4 py-1 rounded-full text-sm font-bold hover:bg-orange-50">
                        Ver todas
                    </button>
                </div>
                <div id="requests-list" class="flex flex-col gap-4"></div>
            </div>

            <div class="flex flex-col gap-6">
                
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-700 text-center mb-6 text-sm uppercase tracking-wide">Ações Rápidas</h3>
                    <div class="flex flex-col gap-3">
                        
                        <a href="../cadastrar-animal/cadastro-animal.html" class="w-full bg-brand-orange text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-orange-200 hover:brightness-105 transition-all cursor-pointer no-underline">
                            <div class="bg-white/20 rounded-full p-1"><i class="ph-bold ph-plus text-white"></i></div>
                            Cadastrar Novo Pet
                        </a>

                        <a href="../animais-cadastrados/animais-cadastrados.html" class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-orange-200 hover:brightness-105 transition-all cursor-pointer no-underline">
                            <div class="bg-white/20 rounded-full p-1"><i class="ph-bold ph-chart-line-up text-white"></i></div>
                            Gerenciar Animais
                        </a>

                    </div>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex-1">
                    <h3 class="font-bold text-gray-700 mb-4 text-sm">Atividades Recentes</h3>
                    <ul id="activity-list" class="space-y-4 text-sm relative border-l-2 border-orange-100 ml-2 pl-4"></ul>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
