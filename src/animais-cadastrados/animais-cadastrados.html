<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lau Miau - Animais Cadastrados</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="animais-cadastrados.css">
</head>
<body>

    <header>
        <div class="header-left">
            <a href="login.html" class="back-btn" title="Sair">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="page-title">Animais Cadastrados</h1>
        </div>
        <div class="user-info">
            <span>Admin</span>
            <div class="user-avatar">A</div>
        </div>
    </header>

    <main>
        
        <div class="toolbar">
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar animais por nome ou ID...">
            </div>
            
           <a href="../cadastrar-animal/cadastro-animal.html" class="btn-primary">
                <i class="fa-solid fa-plus"></i>
                Novo Cadastro
            </a>
        </div>

        <div class="grid-container" id="animalsGrid">
            </div>

    </main>

    <script src="animais-cadastrados.js" defer></script>

</html>
