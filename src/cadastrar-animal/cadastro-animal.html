<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lau Miau - Cadastrar Animal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#FF9900',
                            hover: '#E68A00',
                            bg: '#FFFBF5',
                            text: '#1F2937',
                            gray: '#9CA3AF'
                        }
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-brand-bg min-h-screen flex flex-col font-sans text-brand-text">

    <header class="p-6 md:px-12 flex items-center">
        <a href="index.html" class="bg-white p-3 rounded-full shadow-sm text-gray-500 hover:text-brand-orange hover:shadow-md transition-all group">
            <i class="ph-bold ph-arrow-left text-xl group-hover:-translate-x-1 transition-transform"></i>
        </a>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        
        <div class="w-full max-w-2xl">
            
            <h1 class="text-3xl font-bold text-center text-gray-700 mb-10">Cadastrar Animal</h1>

            <form id="petForm" onsubmit="handleRegister(event)" class="space-y-6">
                
                <div class="space-y-2">
                    <label for="name" class="block text-sm font-semibold text-gray-600 pl-4">Nome do animal</label>
                    <input type="text" id="name" required placeholder="Ex: Thor"
                        class="w-full bg-white border border-transparent focus:border-brand-orange focus:ring-0 rounded-full py-3 px-6 shadow-sm outline-none text-gray-700 placeholder-gray-300 transition-all"
                    >
                </div>

                <div class="space-y-2">
                    <label for="species" class="block text-sm font-semibold text-gray-600 pl-4">Espécie</label>
                    <div class="relative">
                        <select id="species" required class="w-full bg-white border border-transparent focus:border-brand-orange focus:ring-0 rounded-full py-3 px-6 shadow-sm outline-none text-gray-700 appearance-none cursor-pointer">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Cachorro">Cachorro</option>
                            <option value="Gato">Gato</option>
                            <option value="Outro">Outro</option>
                        </select>
                        <i class="ph-bold ph-caret-down absolute right-6 top-1/2 -translate-y-1/2 text-brand-orange pointer-events-none"></i>
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="breed" class="block text-sm font-semibold text-gray-600 pl-4">Raça</label>
                    <input type="text" id="breed" required placeholder="Ex: Vira-lata / SRD"
                        class="w-full bg-white border border-transparent focus:border-brand-orange focus:ring-0 rounded-full py-3 px-6 shadow-sm outline-none text-gray-700 transition-all"
                    >
                </div>

                <div class="space-y-2">
                    <label for="age" class="block text-sm font-semibold text-gray-600 pl-4">Idade</label>
                    <input type="text" id="age" placeholder="Ex: 2 anos" required 
                        class="w-full bg-white border border-transparent focus:border-brand-orange focus:ring-0 rounded-full py-3 px-6 shadow-sm outline-none text-gray-700 transition-all"
                    >
                </div>

                <div class="space-y-2">
                    <label for="gender" class="block text-sm font-semibold text-gray-600 pl-4">Sexo</label>
                    <div class="relative">
                        <select id="gender" required class="w-full bg-white border border-transparent focus:border-brand-orange focus:ring-0 rounded-full py-3 px-6 shadow-sm outline-none text-gray-700 appearance-none cursor-pointer">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Macho">Macho</option>
                            <option value="Fêmea">Fêmea</option>
                        </select>
                        <i class="ph-bold ph-caret-down absolute right-6 top-1/2 -translate-y-1/2 text-brand-orange pointer-events-none"></i>
                    </div>
                </div>

                <div class="space-y-2 pt-4">
                    <span class="block text-sm font-semibold text-gray-600 text-center mb-2">Adicionar foto</span>
                    
                    <label for="imageUpload" class="group flex flex-col items-center justify-center w-48 h-32 mx-auto border-2 border-dashed border-gray-300 rounded-2xl cursor-pointer hover:border-brand-orange hover:bg-orange-50 transition-all bg-gray-50/50 relative overflow-hidden">
                        <div id="uploadPlaceholder" class="flex flex-col items-center justify-center pt-5 pb-6 transition-opacity">
                            <i class="ph-fill ph-image text-4xl text-gray-400 group-hover:text-brand-orange transition-colors"></i>
                            <i class="ph-bold ph-plus text-sm text-gray-400 absolute ml-6 -mt-6 bg-white rounded-full border border-white"></i>
                        </div>
                        <input id="imageUpload" type="file" class="hidden" accept="image/*" onchange="previewImage(this)" />
                        <img id="imagePreview" class="hidden w-full h-full object-cover absolute inset-0" />
                    </label>
                </div>

                <div class="flex flex-col-reverse md:flex-row justify-center gap-4 md:gap-6 pt-8 pb-12">
                    <button type="button" onclick="window.location.href='index.html'" class="border-2 border-brand-orange text-brand-orange font-bold py-3 px-12 rounded-full hover:bg-orange-50 transform hover:-translate-y-0.5 transition-all w-full md:w-40 text-center">
                        Cancelar
                    </button>
                    
                    <button type="submit" class="bg-brand-orange text-white font-bold py-3 px-12 rounded-full shadow-lg shadow-orange-200 hover:bg-brand-hover transform hover:-translate-y-0.5 transition-all w-full md:w-40">
                        Salvar
                    </button>
                </div>

            </form>
        </div>
    </main>

    <script src="cadastro.js"></script>
</body>
</html>
