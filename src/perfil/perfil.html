<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lau Miau - Meu Perfil</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#FF9900',
                            hover: '#E68A00',
                            bg: '#FFFFFF',
                            text: '#1F2937',
                            gray: '#9CA3AF',
                            light: '#F3F4F6'
                        }
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white min-h-screen flex flex-col font-sans text-brand-text">

    <header class="py-5 px-6 md:px-12 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-gray-50 bg-white sticky top-0 z-30">
        <a href="index.html" class="flex items-center gap-1 group">
            <h1 class="text-3xl font-extrabold text-brand-orange tracking-tight flex items-center gap-1">
                <img class="logo" src="/public/img/logo.svg" alt="logo lau miau">
        </a>

        <div class="flex items-center gap-4 w-full md:w-auto">
            <div class="relative flex-1 md:w-80">
                <input type="text" placeholder="Pesquisa" class="w-full border border-gray-200 rounded-full py-2 px-5 pr-10 text-sm focus:outline-none focus:border-brand-orange transition-colors">
                <i class="ph-bold ph-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            </div>
            
            <button class="bg-gray-100 p-2.5 rounded-full text-gray-500 hover:text-brand-orange hover:bg-orange-50 transition-colors relative">
                <i class="ph-bold ph-bell text-xl"></i>
                <span class="absolute top-2 right-2.5 w-2 h-2 bg-red-500 rounded-full"></span>
            </button>

            <div class="w-10 h-10 bg-brand-orange text-white rounded-full flex items-center justify-center font-bold text-lg shadow-md cursor-pointer hover:brightness-110 transition-all">
                B
            </div>
        </div>
    </header>

    <main class="flex-1 px-6 md:px-12 py-8 max-w-6xl mx-auto w-full">
        
        <h2 class="text-3xl font-extrabold text-gray-800 mb-8">
            Bem vinda, <span class="text-brand-orange" id="header-name">Bruna!</span>
        </h2>

        <div class="flex flex-col md:flex-row items-center justify-between gap-6 mb-10 pb-8 border-b border-gray-100">
            <div class="flex items-center gap-5">
                <div class="w-20 h-20 bg-brand-orange/10 text-brand-orange rounded-full flex items-center justify-center text-4xl font-bold border-2 border-orange-100">
                    B
                </div>
                <div class="text-center md:text-left">
                    <h3 class="text-xl font-bold text-gray-800" id="profile-name-display">Bruna D001</h3>
                    <p class="text-gray-500 text-sm" id="profile-email-display">bruna2001@gmail.com</p>
                </div>
            </div>
            <button onclick="enableEdit()" id="btn-edit-mode" class="bg-brand-orange text-white px-6 py-2.5 rounded-lg font-bold shadow-lg shadow-orange-100 hover:bg-brand-hover hover:-translate-y-0.5 transition-all text-sm flex items-center gap-2">
                <i class="ph-bold ph-pencil-simple"></i> Editar Perfil
            </button>
        </div>

        <form id="profileForm" onsubmit="saveProfile(event)" class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6 mb-12">
            
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-wide ml-1">Nome Completo</label>
                <input type="text" id="fullName" readonly class="profile-input w-full bg-gray-50 border border-transparent rounded-lg px-4 py-3 text-gray-700 font-medium transition-all" value="Bruna Souza">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-wide ml-1">Nome de Usuário</label>
                <input type="text" id="username" readonly class="profile-input w-full bg-gray-50 border border-transparent rounded-lg px-4 py-3 text-gray-700 font-medium transition-all" value="BrunaD001">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-wide ml-1">E-mail</label>
                <input type="email" id="email" readonly class="profile-input w-full bg-gray-50 border border-transparent rounded-lg px-4 py-3 text-gray-700 font-medium transition-all" value="bruna2001@gmail.com">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-wide ml-1">Animais Adotados</label>
                <input type="text" id="adopted" readonly class="profile-input w-full bg-gray-50 border border-transparent rounded-lg px-4 py-3 text-gray-700 font-medium transition-all" value="Pandora e 9">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-wide ml-1">Localização</label>
                <div class="relative">
                    <input value="Foz do Iguaçu, PR" readonly class="w-full bg-gray-100 border border-transparent rounded-lg px-4 py-3 text-gray-500 font-medium cursor-not-allowed">
                    <i class="ph-bold ph-lock-key absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-wide ml-1">Preferências</label>
                <input type="text" id="preferences" readonly class="profile-input w-full bg-gray-50 border border-transparent rounded-lg px-4 py-3 text-gray-700 font-medium transition-all" value="Gatos">
            </div>

            <div class="col-span-1 md:col-span-2 justify-end gap-3 mt-4 hidden" id="edit-actions">
                <button type="button" onclick="cancelEdit()" class="text-gray-500 hover:text-red-500 font-bold px-6 py-3 transition-colors">
                    Cancelar
                </button>
                <button type="submit" class="bg-green-500 text-white px-8 py-3 rounded-lg font-bold shadow-lg hover:bg-green-600 transition-all flex items-center gap-2">
                    <i class="ph-bold ph-check"></i> Salvar Alterações
                </button>
            </div>
        </form>

        <div>
            <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                <i class="ph-fill ph-heart text-brand-orange"></i> Meus Animais
            </h3>
            
            <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm flex items-center justify-between hover:shadow-md transition-shadow cursor-pointer group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-orange-50 rounded-full flex items-center justify-center text-brand-orange group-hover:bg-orange-100 transition-colors">
                        <i class="ph-fill ph-cat text-2xl"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-gray-800 group-hover:text-brand-orange transition-colors">Pandora</h4>
                        <p class="text-xs text-gray-500">Gato, Fêmea • Adotada há 1 ano</p>
                    </div>
                </div>
                <span class="text-brand-orange font-bold text-sm bg-orange-50 px-4 py-2 rounded-full group-hover:bg-brand-orange group-hover:text-white transition-all">
                    Ver Detalhes
                </span>
            </div>
        </div>

    </main>

    <script src="perfil.js"></script>
</body>
</html>
