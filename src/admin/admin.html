<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lau Miau - Área Administrativa</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="back-button-container">
        <a href="../login/index.html" class="btn-back" title="Voltar para Login">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
    </div>

    <main>
        <div class="lock-icon-container">
            <i class="fa-solid fa-lock lock-icon"></i>
        </div>

        <h1>Área Administrativa</h1>
        <p class="subtitle">Entre com suas credenciais para acessar o painel administrativo</p>

        <form id="adminForm">
            <div class="input-group">
                <i class="fa-regular fa-user input-icon"></i>
                <input type="text" placeholder="Usuário ou Email" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="Senha" required>
                <i class="fa-regular fa-eye-slash toggle-password" id="togglePassword"></i>
            </div>

            <a href="#" class="forgot-password">esqueceu sua senha?</a>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <footer>
            <a href="#">Política de Privacidade</a>
            <i class="fa-solid fa-paw" style="color: var(--primary-orange); font-size: 10px;"></i>
            <a href="#">Termos de Serviço</a>
        </footer>
    </main>

    <script src="admin.js" defer></script>

</body>
</html>
